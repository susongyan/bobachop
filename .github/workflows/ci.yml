name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build (Java 8 release baseline)
        run: mvn -B -ntp verify
      - name: Checkstyle
        run: |
          FILES=$(find . -name '*.java' -not -path '*/target/*')
          if [ -n "$FILES" ]; then
            curl -sSfL -o /tmp/checkstyle.jar \
              https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.4/checkstyle-10.12.4-all.jar
            java -jar /tmp/checkstyle.jar -c checkstyle.xml $FILES
          fi
