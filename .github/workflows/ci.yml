name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build (Java 8 release baseline)
        run: mvn -B -ntp verify
      # checkstyle 已绑进 pom 的 verify 阶段（maven-checkstyle-plugin + checkstyle 10.12.4），
      # 本地 mvn install 与 CI 同一门禁，无需独立步骤
